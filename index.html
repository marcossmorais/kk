<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd1e3">
<title>Contrato de Namoro 💗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap">
<style>
:root{
  --p1:#fff0f6; --p2:#ffd1e3; --p3:#ff9ec4; --p4:#ff5c9d; --p5:#c2185b; --ink:#7a1f4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#ffe3ef,#ffc2da 60%,#ffadd0);font-family:"Quicksand","Nunito",-apple-system,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink)}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fh{position:absolute;bottom:-40px;opacity:.55;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

.photos{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:0;margin-top:6px}
.ph{width:118px;height:148px;border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px rgba(194,24,91,.25)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.l{transform:rotate(-6deg);margin-right:-10px}
.ph.r{transform:rotate(6deg);margin-left:-10px}
.ph.l img{object-position:50% 30%}.ph.r img{object-position:50% 12%}
.mid{position:relative;z-index:2;font-size:34px;animation:beat 1.1s infinite;filter:drop-shadow(0 3px 4px rgba(194,24,91,.4))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.names{z-index:1;font-family:Pacifico,cursive;font-size:22px;margin:10px 0 2px;color:var(--p5)}
.dots{z-index:1;display:flex;gap:6px;margin:6px 0 10px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.7;transition:.3s}
.dots i.on{background:var(--p4);opacity:1;transform:scale(1.25)}

.card{position:relative;z-index:1;flex:1;width:100%;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-radius:32px;
  padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 30px rgba(194,24,91,.18);max-height:360px}
.num{width:44px;height:44px;border-radius:50%;background:var(--p4);color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(255,92,157,.5)}
.card h2{margin:12px 0 6px;font-size:22px;color:var(--p5)}
.card p{margin:0;font-size:17px;line-height:1.4;font-weight:500}
.msg{margin-top:auto;min-height:22px;font-size:14px;color:var(--p5);font-weight:700}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.actions{z-index:5;display:flex;gap:16px;align-items:center;justify-content:center;width:100%;height:84px;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;padding:15px 34px;font-size:18px;transition:transform .15s}
#yes{background:linear-gradient(135deg,#ff7db3,#ff3d86);color:#fff;box-shadow:0 8px 18px rgba(255,61,134,.45);transform-origin:center}
#yes:active{transform:scale(.94)}
#no{background:#fff;color:var(--p5);box-shadow:0 6px 14px rgba(194,24,91,.2)}
#no.fly{position:fixed;z-index:50;transition:left .25s ease,top .25s ease}

.final{display:none;z-index:1;width:100%;flex:1;flex-direction:column;align-items:center;text-align:center}
.final .card{max-height:none}
.sign{font-family:Pacifico,cursive;font-size:26px;color:var(--p5);margin-top:14px;line-height:1.5}
.seal{font-size:64px;animation:beat 1.1s infinite;margin:8px 0}
</style>
</head>

  </div>
  <div class="names">Marcos &amp; Kaylane</div>
  <div class="dots" id="dots"></div>

  <div class="card pop" id="card">
    <div class="num" id="num">1</div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="msg" id="msg"></div>
  </div>

  <div class="actions" id="actions">
    <button id="yes">Sim 💗</button>
    <button id="no">Não 💔</button>
  </div>

  <div class="final" id="final">
    <div class="card pop">
      <div class="seal">💍</div>
      <h2>Contrato assinado!</h2>
      <p>Kaylane aceitou todas as cláusulas.<br>Agora é oficial: somos namorados 🥰</p>
      <div class="sign">Marcos &amp; Kaylane<br>💞 pra sempre 💞</div>
    </div>
  </div>
</div>

<script>
const clauses=[
 ["Apelidos carinhosos","Você aceita ser chamada de meu amor, minha linda, minha gatinha e outros apelidos fofos? 🐱"],
 ["Encontros e programas","Prometemos encontros regulares e atividades divertidas juntos: jantar romântico, piquenique, cinema… 🍿"],
 ["Comunicação","Se algo incomodar, a gente conversa e resolve, combinado? 💬"],
 ["Tempo individual","Respeitamos o espaço de cada um. Se precisar, recarregamos as energias com momentos individuais. 🌸"],
 ["Surpresas e mimos","Gestos de carinho, flores, bilhetes e presentes inesperados são muito bem-vindos! 🌷"],
 ["Beijos e abraços","São obrigatórios, principalmente em momentos difíceis. 🫂💋"],
 ["Fidelidade e confiança","Comprometemo-nos a ser fiéis e confiar um no outro. 🤞"],
 ["Renovação","Este contrato será renovado anualmente, pra sempre. Aceita? 🔁💖"],
 ["Pedido oficial","Kaylane, você aceita ser minha namorada e assinar este contrato de namoro? 💍"]
];
const teases=["Tem certeza? 🥺","Esse botão tá fugindo! 😝","Errou! Tenta o Sim 💗","Quase! Mas não 😏","Haha, não vai rolar 🙈","Clica no Sim, vai 🥹","Tô vendo você tentando 👀","Ele não deixa 😂"];
let i=0,tries=0;
const $=id=>document.getElementById(id);
const yes=$('yes'),no=$('no'),actions=$('actions');
$('dots').innerHTML=clauses.map(()=>'<i></i>').join('');

function render(){
  const [t,x]=clauses[i];
  $('num').textContent=i+1;$('title').textContent=t;$('text').textContent=x;$('msg').textContent='';
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k<=i));
  const c=$('card');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
  tries=0;yes.style.transform='';
  no.classList.remove('fly');no.style.left=no.style.top='';
}
function dodge(e){
  if(e){e.preventDefault();e.stopPropagation();}
  tries++;
  no.classList.add('fly');
  const w=window.innerWidth,h=window.innerHeight,bw=no.offsetWidth,bh=no.offsetHeight,pad=12;
  const yr=yes.getBoundingClientRect();
  let x,y,k=0;
  do{
    x=pad+Math.random()*(w-bw-2*pad);
    y=pad+Math.random()*(h-bh-2*pad);
    k++;
  }while(k<40&&x<yr.right+20&&x+bw>yr.left-20&&y<yr.bottom+20&&y+bh>yr.top-20);
  no.style.left=x+'px';no.style.top=y+'px';
  $('msg').textContent=teases[Math.floor(Math.random()*teases.length)];
  yes.style.transform='scale('+Math.min(1+tries*.06,1.5)+')';
  if(navigator.vibrate)navigator.vibrate(20);
}
['pointerenter','pointerdown','touchstart','click'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));

yes.addEventListener('click',()=>{
  burst(10);
  if(i<clauses.length-1){i++;render();}
  else{
    ['card','actions','dots'].forEach(id=>$(id).style.display='none');
    no.style.display='none';
    $('final').style.display='flex';
    burst(60);
  }
});

function heart(emoji,opts={}){
  const el=document.createElement('div');
  el.className='fh';el.textContent=emoji;
  el.style.left=(opts.x??Math.random()*100)+'vw';
  el.style.fontSize=(14+Math.random()*22)+'px';
  el.style.animationDuration=(opts.d??(6+Math.random()*6))+'s';
  $('hearts').appendChild(el);
  setTimeout(()=>el.remove(),13000);
}
const em=['💗','💖','💕','🌸','💞','🎀'];
function burst(n){for(let k=0;k<n;k++)setTimeout(()=>heart(em[k%em.length],{d:2.5+Math.random()*2}),k*40);}
setInterval(()=>heart(em[Math.floor(Math.random()*em.length)]),700);
render();
</script>
</body>
